<!-- Moretti Group lab: shared configuration for the "windows" agent group (DC01, WS-FIN01). -->
<agent_config>
  <!-- Sysmon and PowerShell, on top of the Security, System and Application channels that the
       agent collects by default. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
