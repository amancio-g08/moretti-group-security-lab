<!-- Moretti Group lab: shared configuration for the "domain-controllers" agent group (DC01). -->
<agent_config>
  <!-- File integrity on Group Policy files: a changed GPO can push code to every computer
       (T1484.001). Changes made by New-LabGpos.ps1 are expected and show up here too. -->
  <syscheck>
    <directories check_all="yes" realtime="yes">C:\Windows\SYSVOL\domain\Policies</directories>
  </syscheck>
</agent_config>
