<!-- Moretti Group lab: shared configuration for the "linux" agent group (WS-DEV01, APP-FIN01). -->
<agent_config>
  <!-- File integrity: SSH and sudo configuration, root's SSH keys (persistence, T1098.004). -->
  <syscheck>
    <directories check_all="yes" realtime="yes">/etc/ssh,/etc/sudoers,/etc/sudoers.d</directories>
    <directories check_all="yes" realtime="yes">/root/.ssh</directories>
  </syscheck>
</agent_config>
