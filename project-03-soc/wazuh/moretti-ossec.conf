<!--
  Moretti Group lab: settings added to the manager's /var/ossec/etc/ossec.conf by
  deploy-ruleset.sh, between the "moretti-lab" markers. __LOG_BUCKET__ is replaced with the log
  bucket of the bootstrap stack. Custom rules need no entry: etc/rules is loaded by default.
-->
<ossec_config>
  <!-- Agents must present the enrollment password (stored in SSM Parameter Store). -->
  <auth>
    <use_password>yes</use_password>
  </auth>

  <!-- Account lists generated from data/ (render_wazuh_lists.py). -->
  <ruleset>
    <list>etc/lists/moretti-terminated-accounts</list>
    <list>etc/lists/moretti-on-leave-accounts</list>
    <list>etc/lists/moretti-break-glass-accounts</list>
    <list>etc/lists/moretti-service-accounts</list>
    <list>etc/lists/moretti-admin-accounts</list>
    <list>etc/lists/moretti-privileged-groups</list>
  </ruleset>

  <!-- CloudTrail and VPC Flow Logs from the bootstrap log bucket (read-only IAM role). -->
  <wodle name="aws-s3">
    <disabled>no</disabled>
    <interval>10m</interval>
    <run_on_start>yes</run_on_start>
    <skip_on_error>yes</skip_on_error>
    <bucket type="cloudtrail">
      <name>__LOG_BUCKET__</name>
      <path>cloudtrail</path>
      <regions>us-east-1</regions>
    </bucket>
    <bucket type="vpcflow">
      <name>__LOG_BUCKET__</name>
      <path>flowlogs</path>
      <regions>us-east-1</regions>
    </bucket>
  </wodle>
</ossec_config>
