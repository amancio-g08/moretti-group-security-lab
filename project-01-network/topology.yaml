# Packet Tracer topology: device models, canvas positions and cabling.
#
# Host addressing is NOT here: it comes from data/assets.yaml and data/network-matrix.yaml.
# Device configurations come from configs/*.txt. The build script
# packet-tracer/build-topology.js is generated from all of them by
# tools/build_ptbuilder_script.py.

devices:
  # name, PTBuilder model, x, y, config file (network devices only), credentials type
  - {name: INTERNET-SRV, model: Server-PT, x: 700, y: 40}
  - {name: ISP-SIM,      model: ISR4331,   x: 700, y: 140, config: ISP-SIM.txt}
  - {name: R-EDGE01,     model: ISR4331,   x: 700, y: 240, config: R-EDGE01.txt, credentials: ios}
  - {name: FW01,         model: 5506-X,    x: 700, y: 340, config: FW01.txt, credentials: asa}
  - {name: WEB01,        model: Server-PT, x: 950, y: 340}
  - {name: CORE-SW01,    model: 3650-24PS, x: 700, y: 460, config: CORE-SW01.txt, credentials: ios, power_supply: true}
  - {name: ACC-SW01,     model: 2960-24TT, x: 250, y: 600, config: ACC-SW01.txt, credentials: ios}
  - {name: ACC-SW02,     model: 2960-24TT, x: 600, y: 600, config: ACC-SW02.txt, credentials: ios}
  - {name: ACC-SW03,     model: 2960-24TT, x: 900, y: 600, config: ACC-SW03.txt, credentials: ios}
  - {name: SRV-SW01,     model: 2960-24TT, x: 1250, y: 600, config: SRV-SW01.txt, credentials: ios}
  # floor 1
  - {name: WS-EXE01,     model: PC-PT, x: 90,  y: 760}
  - {name: WS-INV01,     model: PC-PT, x: 170, y: 760}
  - {name: WS-FIN01,     model: PC-PT, x: 250, y: 760}
  - {name: PC-DHCP-TEST, model: PC-PT, x: 330, y: 760}
  - {name: WS-HR01,      model: PC-PT, x: 410, y: 760}
  # floor 2
  - {name: WS-IR01,      model: PC-PT, x: 480, y: 760}
  - {name: WS-OPS01,     model: PC-PT, x: 560, y: 760}
  - {name: WS-DEV01,     model: PC-PT, x: 640, y: 760}
  - {name: GUEST01,      model: PC-PT, x: 720, y: 760}
  # IT and security
  - {name: WS-IT01,      model: PC-PT, x: 860, y: 760}
  - {name: SEC-WS01,     model: PC-PT, x: 940, y: 760}
  # server farm
  - {name: DC01,         model: Server-PT, x: 1050, y: 760}
  - {name: DC02,         model: Server-PT, x: 1130, y: 760}
  - {name: FS01,         model: Server-PT, x: 1210, y: 760}
  - {name: APP-FIN01,    model: Server-PT, x: 1290, y: 760}
  - {name: DB-FIN01,     model: Server-PT, x: 1370, y: 760}
  - {name: APP-INV01,    model: Server-PT, x: 1450, y: 760}
  - {name: APP-HR01,     model: Server-PT, x: 1050, y: 880}
  - {name: APP-CRM01,    model: Server-PT, x: 1130, y: 880}
  - {name: GIT01,        model: Server-PT, x: 1210, y: 880}
  - {name: BKP01,        model: Server-PT, x: 1290, y: 880}
  - {name: SIEM01,       model: Server-PT, x: 1370, y: 880}
  - {name: JUMP01,       model: Server-PT, x: 1450, y: 880}

links:
