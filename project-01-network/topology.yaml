  - [FW01,         GigabitEthernet1/3,   WEB01,     FastEthernet0,        straight]
  - [FW01,         GigabitEthernet1/2,   CORE-SW01, GigabitEthernet1/0/24, straight]
  - [CORE-SW01,    GigabitEthernet1/0/1, ACC-SW01,  GigabitEthernet0/1,   straight]
  - [CORE-SW01,    GigabitEthernet1/0/2, ACC-SW02,  GigabitEthernet0/1,   straight]
  - [CORE-SW01,    GigabitEthernet1/0/3, ACC-SW03,  GigabitEthernet0/1,   straight]
  - [CORE-SW01,    GigabitEthernet1/0/4, SRV-SW01,  GigabitEthernet0/1,   straight]
