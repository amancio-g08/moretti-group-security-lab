# Git hooks that run on every commit.
# Install once per clone:  pip install pre-commit && pre-commit install
# Run on demand:           pre-commit run --all-files
# Update pinned versions:  pre-commit autoupdate

repos:
  # Secret scanning — the primary control behind "never commit secrets".
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # General hygiene checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Source-of-truth validation (ADR-001): a malformed policy file cannot be committed.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-jsonschema
        name: validate data/company.yaml
        files: ^data/company\.yaml$
        args: ["--schemafile", "data/schemas/company.schema.json"]
      - id: check-jsonschema
        name: validate data/assets.yaml
        files: ^data/assets\.yaml$
        args: ["--schemafile", "data/schemas/assets.schema.json"]
      - id: check-jsonschema
        name: validate data/network-matrix.yaml
        files: ^data/network-matrix\.yaml$
        args: ["--schemafile", "data/schemas/network-matrix.schema.json"]
      - id: check-jsonschema
        name: validate data/roles.yaml
        files: ^data/roles\.yaml$
        args: ["--schemafile", "data/schemas/roles.schema.json"]
      - id: check-jsonschema
        name: validate data/accounts.yaml
        files: ^data/accounts\.yaml$
        args: ["--schemafile", "data/schemas/accounts.schema.json"]

  # Python lint and format for P05 (settings in project-05-python/pyproject.toml).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff-check
        files: ^project-05-python/
      - id: ruff-format
        files: ^project-05-python/

  # Lab scripts (infrastructure/scripts).
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x", "-P", "SCRIPTDIR"]

  # Network policy as code (ADR-001, ADR-008): the core ACLs must match the matrix.
  - repo: local
    hooks:
      - id: core-acls-in-sync
        name: core ACLs regenerated from the matrix
        entry: python project-01-network/tools/render_core_acls.py --check
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        files: ^(data/(network-matrix|assets)\.yaml|project-01-network/(tools/.*|configs/generated/.*))$
        pass_filenames: false
      - id: core-acls-verified
        name: core ACLs enforce the matrix (static verification)
        entry: python project-01-network/tools/verify_core_acls.py
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        files: ^(data/(network-matrix|assets)\.yaml|project-01-network/(tools/.*|configs/generated/.*))$
        pass_filenames: false
      - id: ptbuilder-script-in-sync
        name: Packet Tracer build script regenerated from sources
        entry: python project-01-network/tools/build_ptbuilder_script.py --check
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        files: ^(data/(network-matrix|assets)\.yaml|project-01-network/(topology\.yaml|tools/.*|configs/.*|packet-tracer/build-topology\.js))$
        pass_filenames: false
      - id: security-groups-in-sync
        name: AWS Security Groups regenerated from the matrix
        entry: python infrastructure/tools/render_security_groups.py --check
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        files: ^(data/(network-matrix|assets)\.yaml|project-05-python/src/moretti_sec/(render/.*|company\.py)|infrastructure/(tools/.*|terraform/lab/generated/.*))$
        pass_filenames: false
      - id: ad-plan-in-sync
        name: Active Directory plan regenerated from data
        entry: python project-04-iam/tools/render_ad_plan.py --check
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        files: ^(data/(employees\.csv|(roles|accounts|company)\.yaml)|project-05-python/src/moretti_sec/(render/.*|company\.py)|project-04-iam/(tools/.*|generated/.*))$
        pass_filenames: false
      - id: wazuh-lists-in-sync
        name: Wazuh account lists regenerated from data
        entry: python project-03-soc/tools/render_wazuh_lists.py --check
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        files: ^(data/(employees\.csv|accounts\.yaml)|project-05-python/src/moretti_sec/(render/.*|company\.py)|project-03-soc/(tools/.*|detections/lists/.*))$
        pass_filenames: false
