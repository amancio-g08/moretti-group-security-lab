# Moretti Group — asset inventory (FICTITIOUS)
#
# Source of truth for hosts and network devices (ADR-001).
# Consumed by: network matrix (asset references), Terraform (AWS hosts), Python enrichment
# (IP -> asset -> owner -> segment), threat model.
#
# environments: where the asset exists — pt = Packet Tracer design, aws = operational lab
#               (ADR-005, ADR-007). aws_phase = roadmap phase in which it is deployed.
# criticality:  critical | high | medium | low
# classification: highest data classification the asset stores or processes.
#
# Addressing convention per /24 segment:
#   .1        default gateway (core SVI in PT; VPC router in AWS)
#   .10-.99   static: servers, infrastructure, reserved workstation addresses
#   .100-.199 DHCP pool for user devices (PT)

assets:
  # ---------------------------------------------------------------- servers (segment 80)
  - id: DC01
    type: server
    role: Active Directory domain controller, DNS, DHCP
    os: Windows Server 2022
    segment: servers
    ip: 10.10.80.10
    owner: it
    criticality: critical
    classification: restricted
    environments: [pt, aws]
    aws_phase: 5
  - id: DC02
    type: server
    role: Secondary domain controller, DNS
    os: Windows Server 2022
    segment: servers
    ip: 10.10.80.11
