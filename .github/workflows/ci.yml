# Continuous integration: the same checks a contributor runs locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit hooks (secrets, schemas, network policy, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # gitleaks scans the history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  python-tests:
    name: moretti-sec tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: project-05-python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  terraform:
    name: Terraform (fmt, validate, offline plan tests)
    runs-on: ubuntu-latest
    env:
      TF_VERSION: 1.9.8
    steps:
      - uses: actions/checkout@v5
      - name: Install Terraform
        run: |
          curl -sSfL -o /tmp/terraform.zip \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          sudo unzip -o -q /tmp/terraform.zip -d /usr/local/bin
          terraform version
      - run: terraform fmt -check -recursive infrastructure/terraform
      - name: Validate bootstrap
        run: |
          terraform -chdir=infrastructure/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/bootstrap validate
      - name: Validate and test lab (AWS provider mocked, no credentials)
        run: |
          terraform -chdir=infrastructure/terraform/lab init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/lab validate
          terraform -chdir=infrastructure/terraform/lab test

  powershell:
    name: PowerShell (PSScriptAnalyzer, dry runs)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - name: Static analysis
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path project-04-iam -Recurse -Severity Error,Warning -EnableExit
          Invoke-ScriptAnalyzer -Path project-03-soc -Recurse -Severity Error,Warning -EnableExit
      - name: Provisioning dry runs (simulated domain)
        run: ./project-04-iam/tests/Test-ProvisioningDryRun.ps1
      - name: GPO templates
        run: ./project-04-iam/tests/Test-GpoTemplates.ps1

  wireshark-plugin:
    name: Wireshark plugin (Lua engine, differential and tshark tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Lua and tshark
        run: |
          sudo apt-get update -q
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends lua5.4 tshark
      - name: Lua syntax
        run: for f in project-02-pcap/wireshark/*.lua project-02-pcap/tests/*.lua; do luac5.4 -p "$f"; done
      - name: Engine unit tests
        run: lua5.4 project-02-pcap/tests/test_engine.lua
      - run: pip install -e "project-05-python[dev]"
      - name: Differential and end-to-end tests
        working-directory: project-05-python
        env:
          MORETTI_REQUIRE_WIRESHARK: "1"
        run: pytest tests/test_wireshark.py -rs
